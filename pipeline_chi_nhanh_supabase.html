<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0057B8">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">

<style>
  :root{
    --navy:#10263F; --navy-2:#16324F; --teal:#0E7C7B; --teal-light:#E4F3F2;
    --gold:#C9A227; --bg:#F5F7F9; --card:#FFFFFF; --line:#E1E6EA;
    --text:#1C2B36; --text-soft:#5B6B76;
    --red:#C0392B; --orange:#D97706; --green:#1E8E5A; --blue:#2563A8; --cyan:#0E8FA1; --yellow:#B8860B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI','Inter',system-ui,-apple-system,Roboto,Arial,sans-serif;}
  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy-2)); color:#fff; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.15);}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
  .brand h1{font-size:16px; margin:0; font-weight:600;}
  .brand small{display:block; font-size:11px; color:#B9C6D2; margin-top:2px;}
  .user-chip{display:flex; align-items:center; gap:10px; font-size:13px;}
  .user-chip button{background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px;}
  .user-chip button:hover{background:rgba(255,255,255,0.22);}
  .wrap{max-width:1180px; margin:0 auto; padding:24px;}
  .login-screen{
    min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 15%, rgba(201,162,39,0.10), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(14,124,123,0.10), transparent 45%),
      linear-gradient(160deg, #EEF2F6 0%, #F5F7F9 60%);
    padding:24px;
  }
  .login-card{
    background:var(--card); border-radius:18px; box-shadow:0 20px 50px rgba(16,38,63,0.16);
    padding:40px 36px 34px; width:400px; max-width:100%; border-top:4px solid var(--gold); position:relative;
  }
  .bank-icon-wrap{display:flex; justify-content:center; margin-bottom:16px;}
  .bank-icon-badge{
    width:64px; height:64px; border-radius:16px;
    background:linear-gradient(135deg, var(--navy), var(--navy-2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(16,38,63,0.25);
  }
  .login-card h2{text-align:center;}
  .login-card > p{text-align:center;}
  .login-card h2{margin:0 0 4px; font-size:19px; color:var(--navy);}
  .login-card p{margin:0 0 22px; font-size:13px; color:var(--text-soft);}
  label{display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin:12px 0 6px;}
  input,select{width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; font-size:13.5px; color:var(--text); background:#fff; outline:none;}
  input:focus,select:focus{border-color:var(--teal);}
  .btn-primary{margin-top:20px; width:100%; padding:11px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary:hover{background:var(--navy-2);}
  .err{color:var(--red); font-size:12.5px; margin-top:10px;}
  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1.5px solid var(--line);}
  .tabs button{padding:10px 16px; border:none; background:none; font-size:13.5px; font-weight:600; color:var(--text-soft); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1.5px;}
  .tabs button.active{color:var(--teal); border-bottom-color:var(--teal);}
  .card{background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:0 1px 3px rgba(16,38,63,0.06); border:1px solid var(--line); margin-bottom:18px;}
  .card h3{margin:0 0 14px; font-size:14.5px; color:var(--navy);}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px 16px;}
  @media(max-width:800px){.grid4{grid-template-columns:1fr 1fr;}}
  .section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--teal); margin:18px 0 8px; padding-top:10px; border-top:1px dashed var(--line);}
  .section-label:first-child{border-top:none; margin-top:0; padding-top:0;}
  table{width:100%; border-collapse:collapse; font-size:12.8px;}
  th{text-align:left; padding:9px 10px; background:var(--navy); color:#fff; font-weight:600; white-space:nowrap;}
  td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tr:hover td{background:#F8FBFB;}
  .table-scroll{overflow-x:auto; border-radius:8px; border:1px solid var(--line);}
  .badge{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block; color:#fff;}
  .b-tiemnang{background:var(--blue);} .b-lienhe{background:var(--cyan);} .b-tuvan{background:var(--yellow);}
  .b-damphan{background:var(--orange);} .b-dangxuly{background:#6D4AA8;} .b-thanhcong{background:var(--green);} .b-thatbai{background:var(--red);}
  .stat-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); gap:10px; margin-bottom:18px;}
  @media(max-width:900px){.stat-cards{grid-template-columns:repeat(3,1fr);}}
  .stat{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; text-align:center;}
  .stat .num{font-size:20px; font-weight:700; color:var(--navy);}
  .stat .lbl{font-size:10.5px; color:var(--text-soft); margin-top:2px;}
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .filters select, .filters input{width:auto; min-width:150px;}
  .btn-sm{padding:6px 12px; font-size:12px; border-radius:6px; border:1.5px solid var(--teal); background:#fff; color:var(--teal); cursor:pointer; font-weight:600;}
  .btn-sm:hover{background:var(--teal-light);}
  .btn-add{background:var(--teal); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn-danger{border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:#FDEDEC;}
  .empty{text-align:center; padding:40px 20px; color:var(--text-soft); font-size:13.5px;}
  .loading{text-align:center; padding:60px; color:var(--text-soft);}
  .note{font-size:11.5px; color:var(--text-soft); background:#FFF8E7; border:1px solid #F0E0A8; padding:10px 12px; border-radius:8px; margin-bottom:16px;}
  .charts-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:900px){.charts-grid{grid-template-columns:1fr;}}
  .chart-status-filter{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-top:18px; padding:10px 12px; background:#F8FAFA; border:1px solid var(--line); border-radius:8px;}
  .chart-status-filter .filter-title{font-size:11.5px; font-weight:700; color:var(--text-soft); width:100%;}
  .chart-status-filter label{display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12.5px; white-space:nowrap;}
  .chart-status-filter input[type=checkbox]{width:16px; height:16px; flex-shrink:0; accent-color:var(--teal);}
  .chart-status-filter .dot{display:inline-block; width:10px; height:10px; border-radius:2px; flex-shrink:0;}
  @media(max-width:600px){
    .chart-status-filter{gap:10px 8px;}
    .chart-status-filter label{flex:1 1 44%; font-size:12.5px;}
  }
  .chart-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px;}
  .chart-box h4{margin:0 0 10px; font-size:12.5px; color:var(--navy); font-weight:700;}
  .chart-canvas-wrap{position:relative; height:230px;}
  .chart-canvas-wrap.wide{height:260px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="dot"></div>
    <div><h1>Quản lý Pipeline Khách hàng</h1><small>Chi nhánh · Kết nối Supabase</small></div>
  </div>
  <div class="user-chip" id="user-chip" style="display:none;">
    <span id="user-label"></span>
    <button onclick="logout()">Đăng xuất</button>
  </div>
</div>
<div class="wrap" id="app"><div class="loading">Đang tải...</div></div>

<div id="note-modal" style="display:none; position:fixed; inset:0; background:rgba(16,38,63,0.55); z-index:999; align-items:center; justify-content:center; padding:20px;" onclick="if(event.target===this) closeNoteModal()">
  <div style="background:#fff; border-radius:14px; padding:22px; max-width:440px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.3);">
    <h3 id="note-modal-title" style="margin:0 0 4px; color:var(--navy); font-size:15px;"></h3>
    <div id="note-modal-meta" style="font-size:11.5px; color:var(--text-soft); margin-bottom:12px;"></div>
    <div id="note-modal-body" style="font-size:13.5px; color:var(--text); white-space:pre-wrap; line-height:1.6; max-height:280px; overflow-y:auto; background:#F8FAFA; border-radius:8px; padding:12px; border:1px solid var(--line);"></div>
    <button class="btn-sm" style="margin-top:16px;" onclick="closeNoteModal()">Đóng</button>
  </div>
</div>

<script>
/* ============ 1. CẤU HÌNH SUPABASE — DÁN THÔNG TIN CỦA ANH VÀO ĐÂY ============ */
const SUPABASE_URL = "https://izufeangdonspfjovkkq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nfU66O7jMnOWZLtW0K7XFw_8-ZLU-kW";
/* =============================================================================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let STATUSES = []; // nạp động từ bảng "statuses" trong Supabase - giám đốc thêm/sửa/xóa/đổi thứ tự được
let STATUS_LIST = []; // nhãn hiển thị theo đúng thứ tự
let STATUS_RANK = {};  // nhãn -> mức phễu
let STATUS_COLORS = {}; // nhãn -> màu hex

async function loadStatuses(){
  const {data, error} = await sb.from('statuses').select('*').eq('active', true).order('sort_order');
  STATUSES = error ? [] : data;
  STATUS_LIST = STATUSES.map(s => s.label);
  STATUS_RANK = {}; STATUS_COLORS = {};
  STATUSES.forEach(s => { STATUS_RANK[s.label] = s.rank; STATUS_COLORS[s.label] = s.color; });
}
let chartInstances = {};
let PRODUCTS = []; // nạp động từ bảng "products" trong Supabase - giám đốc thêm/bớt được

async function loadProducts(){
  const {data, error} = await sb.from('products').select('*').eq('active', true).order('sort_order');
  PRODUCTS = error ? [] : data.map(p => ({key:p.key, label:p.label, unit:p.unit}));
}

let session = null;   // {user, profile:{full_name, role, ma_ao}}
let records = [];
let editingId = null;

function fromDb(row){
  const rec = {
    id:row.id, ownerId:row.owner_id, maAO:row.ma_ao, tenNhanVien:row.ten_nhan_vien, tenKH:row.ten_kh,
    cccd:row.cccd, sdt:row.sdt, ngheNghiep:row.nghe_nghiep, donVi:row.don_vi, tuan:row.tuan,
    ngayUpdate:row.ngay_update, trangThai:row.trang_thai, ghiChu:row.ghi_chu, updatedAt:row.updated_at
  };
  const vals = row.pipeline_values || {};
  PRODUCTS.forEach(p => rec[p.key] = vals[p.key] ?? 0);
  return rec;
}
function toDb(rec){
  const row = {
    ma_ao:rec.maAO, ten_nhan_vien:rec.tenNhanVien, ten_kh:rec.tenKH, cccd:rec.cccd, sdt:rec.sdt,
    nghe_nghiep:rec.ngheNghiep, don_vi:rec.donVi, tuan:rec.tuan, ngay_update:rec.ngayUpdate || null,
    trang_thai:rec.trangThai, ghi_chu:rec.ghiChu || null, updated_at:new Date().toISOString()
  };
  const vals = {};
  PRODUCTS.forEach(p => vals[p.key] = rec[p.key] || 0);
  row.pipeline_values = vals;
  return row;
}

function showTenKHSuggestions(){
  // Gom danh sách khách hàng duy nhất (theo CCCD nếu có, không thì theo tên), lấy bản ghi mới nhất của mỗi người
  const uniqueCustomers = new Map();
  [...records].sort((a,b)=> compareRecency(a,b)).forEach(r=>{
    const key = (r.cccd && r.cccd.trim()) ? r.cccd.trim() : r.tenKH.trim().toLowerCase();
    uniqueCustomers.set(key, r);
  });
  const kw = (document.getElementById('f-tenKH').value || '').trim().toLowerCase();
  // Gõ đúng y hệt 1 khách hàng đã chọn thì vẫn hiện toàn bộ danh sách để đổi sang người khác được
  const list = [...uniqueCustomers.values()].filter(r=>{
    if(!kw) return true;
    if(r.tenKH.trim().toLowerCase() === kw) return true;
    return `${r.tenKH} ${r.cccd||''} ${r.sdt||''}`.toLowerCase().includes(kw);
  }).sort((a,b)=> a.tenKH.localeCompare(b.tenKH));

  const box = document.getElementById('tenKH-suggestions');
  if(!box) return;
  if(list.length===0){ box.style.display = 'none'; return; }
  box.innerHTML = list.map(r => `
    <div style="padding:9px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px;"
      onmousedown="pickTenKHSuggestion('${r.id}')">
      <b>${r.tenKH}</b>
      <div style="font-size:11px; color:var(--text-soft);">${r.cccd || '(không có CCCD)'} ${r.sdt ? '· '+r.sdt : ''}</div>
    </div>`).join('');
  box.style.display = 'block';
}
function hideTenKHSuggestions(){
  const box = document.getElementById('tenKH-suggestions');
  if(box) box.style.display = 'none';
}
function pickTenKHSuggestion(recordId){
  const r = records.find(x=>x.id===recordId);
  if(!r) return;
  fillFromMatch(r);
  hideTenKHSuggestions();
}

function showCustomerNote(recordId){
  const r = records.find(x=>x.id===recordId);
  if(!r) return;
  document.getElementById('note-modal-title').textContent = `📝 ${r.tenKH}`;
  document.getElementById('note-modal-meta').textContent =
    `${r.tuan || ''}${r.trangThai ? ' · Trạng thái: '+r.trangThai : ''}`;
  document.getElementById('note-modal-body').textContent =
    (r.ghiChu && r.ghiChu.trim()) ? r.ghiChu : '(Không có ghi chú cho lần cập nhật này)';
  document.getElementById('note-modal').style.display = 'flex';
}
function closeNoteModal(){
  document.getElementById('note-modal').style.display = 'none';
}

async function loadRecords(){
  const {data, error} = await sb.from('pipeline_records').select('*');
  if(error){ console.error(error); records = []; return; }
  records = data.map(fromDb);
}

async function checkExistingSession(){
  await loadProducts();
  await loadStatuses();
  const {data:{session:s}} = await sb.auth.getSession();
  if(s){ await hydrateSession(s.user); }
  render();
}

async function hydrateSession(user){
  let {data:profile} = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(!profile){
    // Hồ sơ bị thiếu (VD: đăng ký lúc còn bật xác nhận email) -> tự tạo hồ sơ mặc định là nhân viên
    const defaultName = (user.email || '').split('@')[0];
    const {data:created, error:createErr} = await sb.from('profiles')
      .insert([{id:user.id, full_name:defaultName, role:'nv', ma_ao:null, email:user.email||null}])
      .select().single();
    if(createErr || !created){
      authNotice = "Không tìm thấy/khởi tạo được hồ sơ người dùng. Vui lòng báo quản trị viên kiểm tra bảng profiles.";
      session = null;
      return;
    }
    profile = created;
  }
  if(profile.active === false){
    authNotice = "Tài khoản này đã bị vô hiệu hóa. Vui lòng liên hệ giám đốc chi nhánh.";
    session = null;
    await sb.auth.signOut();
    return;
  }
  session = {user, profile};
  await loadRecords();
  if(profile.role === 'gd') await loadPendingRequests();
}

function render(){
  const app = document.getElementById('app');
  const chip = document.getElementById('user-chip');
  if(!session){
    chip.style.display='none';
    app.innerHTML = renderLogin();
  } else {
    chip.style.display='flex';
    const roleLabel = session.profile.role==='gd' ? '🏦 Giám đốc — ' : session.profile.role==='ql' ? '🧭 Quản lý — ' : '👤 NV — ';
    document.getElementById('user-label').textContent = roleLabel + session.profile.full_name;
    const isDirectorView = session.profile.role==='gd' || session.profile.role==='ql';
    app.innerHTML = isDirectorView ? renderDirector() : renderEmployee();
    if(isDirectorView && dirTab==='summary') drawDirCharts();
    if(session.profile.role==='nv') computeTuanLabel();
  }
}

let loginMode = 'login'; // 'login' | 'register'
let authNotice = ""; // chỉ dùng cho thông báo cần đổi tab (VD: sau khi đăng ký xong)

function renderLogin(){
  return `
  <div class="login-screen">
    <div class="login-card">
      <div class="bank-icon-wrap">
        <div class="bank-icon-badge">
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 4L44 15H4L24 4Z" fill="#C9A227"/>
            <rect x="4" y="15" width="40" height="3" fill="#EFE0AE"/>
            <rect x="8" y="20" width="4" height="18" fill="#EFE0AE"/>
            <rect x="16" y="20" width="4" height="18" fill="#EFE0AE"/>
            <rect x="22" y="20" width="4" height="18" fill="#EFE0AE"/>
            <rect x="28" y="20" width="4" height="18" fill="#EFE0AE"/>
            <rect x="36" y="20" width="4" height="18" fill="#EFE0AE"/>
            <rect x="4" y="40" width="40" height="4" fill="#C9A227"/>
          </svg>
        </div>
      </div>
      <h2>${loginMode==='login' ? 'Đăng nhập hệ thống' : 'Đăng ký tài khoản mới'}</h2>
      <p style="margin-bottom:8px;">ACB - Chi nhánh Gia Kiệm</p>
      <p style="margin-top:0;">${loginMode==='login' ? 'Dùng tài khoản được cấp' : 'Tài khoản mới mặc định là nhân viên'}</p>
      <div class="role-toggle">
        <button id="tab-login" class="${loginMode==='login'?'active':''}" onclick="setLoginMode('login')">Đăng nhập</button>
        <button id="tab-register" class="${loginMode==='register'?'active':''}" onclick="setLoginMode('register')">Đăng ký</button>
      </div>
      ${loginMode==='login' ? `
        <label>Email</label>
        <input id="in-email" type="email" placeholder="ten@chinhanh.vn">
        <label>Mật khẩu</label>
        <input id="in-pass" type="password" placeholder="••••••••">
        <button class="btn-primary" onclick="doLogin()">Đăng nhập</button>
      ` : `
        <label>Họ tên</label>
        <input id="reg-hoten" placeholder="VD: Trần Văn A">
        <label>Mã AO</label>
        <input id="reg-maAO" placeholder="VD: 3979">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="ten@chinhanh.vn">
        <label>Mật khẩu</label>
        <input id="reg-pass" type="password" placeholder="Tối thiểu 6 ký tự">
        <label>Vai trò mong muốn</label>
        <select id="reg-role">
          <option value="nv">Nhân viên</option>
          <option value="ql">Quản lý (cần được duyệt)</option>
          <option value="gd">Giám đốc (cần được duyệt)</option>
        </select>
        <button class="btn-primary" onclick="doRegister()">Đăng ký</button>
      `}
      <div id="auth-msg">${authNotice ? `<div class="hint">${authNotice}</div>` : ''}</div>
    </div>
  </div>`;
}

function showAuthMessage(msg, isError){
  const box = document.getElementById('auth-msg');
  if(!box) return;
  box.innerHTML = msg ? `<div class="${isError ? 'err' : 'hint'}">${msg}</div>` : '';
}

function setLoginMode(m){ loginMode=m; authNotice=''; render(); }

async function doRegister(){
  showAuthMessage('');
  const hoTen = document.getElementById('reg-hoten').value.trim();
  const maAO = document.getElementById('reg-maAO').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  const chosenRole = document.getElementById('reg-role').value; // 'nv' | 'ql' | 'gd'
  const wantsElevated = chosenRole === 'gd' || chosenRole === 'ql';
  if(!hoTen || !email || !password){ showAuthMessage('Vui lòng điền đầy đủ Họ tên, Email và Mật khẩu.', true); return; }
  if(password.length < 6){ showAuthMessage('Mật khẩu phải từ 6 ký tự trở lên.', true); return; }
  const {data, error} = await sb.auth.signUp({email, password});
  if(error){ showAuthMessage('Lỗi đăng ký: ' + error.message, true); return; }

  if(data.session && data.user){
    // Tài khoản LUÔN tạo với quyền nhân viên trước; nếu chọn "Giám đốc"/"Quản lý" thì chỉ ghi nhận
    // yêu cầu chờ duyệt (gd_request_status = 'pending', requested_role = vai trò muốn xin), chưa cấp quyền ngay.
    const {error:profErr} = await sb.from('profiles').insert([
      {id:data.user.id, full_name:hoTen, role:'nv', ma_ao:maAO, email,
       gd_request_status: wantsElevated ? 'pending' : null,
       requested_role: wantsElevated ? chosenRole : null}
    ]);
    if(profErr){ showAuthMessage('Tạo tài khoản thành công nhưng lỗi khi lưu hồ sơ: ' + profErr.message, true); return; }
    await sb.auth.signOut();
    authNotice = wantsElevated
      ? `Đăng ký thành công! Yêu cầu làm ${chosenRole==='gd'?'giám đốc':'quản lý'} đang chờ duyệt — trong lúc chờ, hãy đăng nhập bằng quyền nhân viên.`
      : "Đăng ký thành công! Vui lòng đăng nhập bằng email và mật khẩu vừa tạo.";
    loginMode = 'login';
    render();
  } else {
    authNotice = "Đăng ký thành công. Vui lòng kiểm tra email để xác nhận, sau đó quay lại đăng nhập.";
    loginMode = 'login';
    render();
  }
}

function buildCustomerIndex(){
  // byCccd: CCCD -> bản ghi mới nhất của KH đó (CCCD là duy nhất nên không nhầm lẫn)
  // nameGroups: tên (thường) -> Map(CCCD hoặc '' nếu không có -> bản ghi mới nhất), để phát hiện trùng tên
  const byCccd = new Map(), nameGroups = new Map();
  [...records].sort((a,b)=> compareRecency(a,b)).forEach(r=>{
    if(r.cccd && r.cccd.trim()) byCccd.set(r.cccd.trim(), r);
    if(r.tenKH && r.tenKH.trim()){
      const nameKey = r.tenKH.trim().toLowerCase();
      const cccdKey = (r.cccd && r.cccd.trim()) ? r.cccd.trim() : '';
      if(!nameGroups.has(nameKey)) nameGroups.set(nameKey, new Map());
      nameGroups.get(nameKey).set(cccdKey, r);
    }
  });
  return {byCccd, nameGroups};
}

let ambiguousMatches = [];

// Tính Thứ 2 và Chủ nhật của tuần lịch chứa 1 ngày (ngayUpdate dạng YYYY-MM-DD)
function getWeekRange(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const day = d.getDay(); // 0=CN,1=T2,...6=T7
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const pad = n => String(n).padStart(2,'0');
  const disp = x => `${pad(x.getDate())}.${pad(x.getMonth()+1)}.${x.getFullYear()}`;
  const iso = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
  return {mondayISO:iso(monday), sundayISO:iso(sunday), mondayDisp:disp(monday), sundayDisp:disp(sunday)};
}

// Tự tính "từ ... đến ..." = tuần lịch (Thứ 2 -> Chủ nhật) chứa Ngày update
function computeTuanLabel(){
  const elTuan = document.getElementById('f-tuan');
  const elNgay = document.getElementById('f-ngayUpdate');
  if(!elTuan || !elNgay) return;
  const wk = getWeekRange(elNgay.value);
  if(!wk){ elTuan.value = ''; return; }
  elTuan.value = `từ ${wk.mondayDisp} đến ${wk.sundayDisp}`;
}

function fillFromMatch(match){
  document.getElementById('f-tenKH').value = match.tenKH || '';
  document.getElementById('f-cccd').value = match.cccd || '';
  document.getElementById('f-sdt').value = match.sdt || '';
  document.getElementById('f-ngheNghiep').value = match.ngheNghiep || '';
  document.getElementById('f-donVi').value = match.donVi || '';
  if(match.maAO) document.getElementById('f-maAO').value = match.maAO;
  document.getElementById('f-ngayUpdate').value = todayStr(); // lần cập nhật mới luôn tính theo hôm nay
  document.getElementById('f-trangThai').value = match.trangThai || 'Tiềm năng';
  computeTuanLabel();
}

function clearAmbiguityPicker(){

  if(picker) picker.innerHTML = '';
}

function showAmbiguityPicker(matches){
  ambiguousMatches = matches;
  document.getElementById('f-cccd').value = ''; // không đoán bừa, để trống chờ chọn
  const options = matches.map((m,i)=>
    `<option value="${i}">${m.cccd || '(không có CCCD)'} — SĐT ${m.sdt||'?'} — ${m.donVi||m.ngheNghiep||'?'}</option>`
  ).join('');

  if(picker){
    picker.innerHTML = `
      <div class="note" style="background:#FDEDEC; border-color:#F3B9B0; margin-top:8px;">

        <select onchange="selectAmbiguousCustomer(this.value)" style="margin-top:8px;">
          <option value="">-- Chọn CCCD đúng --</option>
          ${options}
        </select>
      </div>`;
  }
}

function selectAmbiguousCustomer(i){
  if(i==='') return;
  fillFromMatch(ambiguousMatches[i]);
  clearAmbiguityPicker();
}

function autofillCustomer(triggerField){
  const idx = buildCustomerIndex();
  clearAmbiguityPicker();
  const tenKH = document.getElementById('f-tenKH').value.trim();
  const cccd = document.getElementById('f-cccd').value.trim();

  if(triggerField==='cccd'){
    if(!cccd){ computeTuanLabel(); return; }
    const match = idx.byCccd.get(cccd);
    if(match) fillFromMatch(match); else computeTuanLabel();
    return;
  }

  // triggerField === 'tenKH'
  if(!tenKH){ computeTuanLabel(); return; }
  const group = idx.nameGroups.get(tenKH.toLowerCase());
  if(!group){ computeTuanLabel(); return; }
  if(group.size === 1){
    fillFromMatch([...group.values()][0]);
  } else {
    showAmbiguityPicker([...group.values()]);
    computeTuanLabel();
  }
}

function getCustomerHighestStatus(tenKH, cccd, excludeId){
  const sameCustomer = records.filter(r=>{
    if(excludeId && r.id===excludeId) return false;
    return cccd ? (r.cccd && r.cccd.trim()===cccd) : (r.tenKH && r.tenKH.trim().toLowerCase()===tenKH.toLowerCase());
  });
  let best = null;
  sameCustomer.forEach(r=>{
    if(!best || (STATUS_RANK[r.trangThai]||0) > (STATUS_RANK[best.trangThai]||0)) best = r;
  });
  return best;
}

async function submitForm(){
  const g = id => document.getElementById(id).value.trim();
  const tenKH = g('f-tenKH'), tenNV = g('f-tenNV');
  if(!tenKH || !tenNV){ alert('Vui lòng nhập tối thiểu Tên nhân viên và Tên khách hàng.'); return; }
  const rec = {
    maAO:g('f-maAO'), tenNhanVien:tenNV, tenKH, cccd:g('f-cccd'), sdt:g('f-sdt'),
    ngheNghiep:g('f-ngheNghiep'), donVi:g('f-donVi'), tuan:g('f-tuan'),
    ngayUpdate:g('f-ngayUpdate'), trangThai:g('f-trangThai'), ghiChu:g('f-ghiChu')
  };

  // Chặn lỡ tay chọn ngược trạng thái (VD: đang Đàm phán mà ghi nhầm về Liên hệ).
  // Cho phép quay lại "Tiềm năng" nếu mức cao nhất trước đó đã "Đang xử lý" (đã khép lại đợt tiếp cận, bắt đầu đợt mới).
  const highest = getCustomerHighestStatus(tenKH, rec.cccd, editingId);
  if(highest){
    const highestRank = STATUS_RANK[highest.trangThai] || 0;
    const newRank = STATUS_RANK[rec.trangThai] || 0;
    const maxRank = Math.max(...STATUSES.map(s=>s.rank), 0);
    const highestIsTerminal = highestRank === maxRank;
    if(!highestIsTerminal && newRank < highestRank){
      const ok = confirm(
        `⚠️ Khách hàng "${tenKH}" đã từng đạt trạng thái "${highest.trangThai}" (cao hơn).\n` +
        `Bạn đang chọn "${rec.trangThai}" (thấp hơn) — có thể do chọn nhầm.\n\n` +
        `Bấm OK nếu chắc chắn muốn lưu, hoặc Hủy để chọn lại trạng thái.`
      );
      if(!ok) return;
    }
  }

  PRODUCTS.forEach(p => { rec[p.key] = parseFloat(document.getElementById('f-'+p.key).value) || 0; });
  const row = toDb(rec);

  if(editingId){
    const {error} = await sb.from('pipeline_records').update(row).eq('id', editingId);
    if(error){ alert('Lỗi khi lưu: ' + error.message); return; }
  } else {
    row.owner_id = session.user.id;
    const {error} = await sb.from('pipeline_records').insert([row]);
    if(error){ alert('Lỗi khi thêm: ' + error.message); return; }
  }
  editingId = null;
  await loadRecords();
  render();
}

function toggleChartStatus(status, checked){

function drawDirCharts(){
  if(!dirChartData) return;
  const {byStatus, totalPipelineByStatus, byEmployee} = dirChartData;
  Object.values(chartInstances).forEach(c => c && c.destroy());
  chartInstances = {};

  const elStatus = document.getElementById('chart-status');
  if(elStatus){
    const statusTotal = STATUS_LIST.reduce((s,st)=> s + (byStatus[st]||0), 0) || 1;
    chartInstances.status = new Chart(elStatus, {
      type:'doughnut',
      plugins:[ChartDataLabels],
      data:{
        labels:STATUS_LIST,
        datasets:[{data:STATUS_LIST.map(s=>byStatus[s]), backgroundColor:STATUS_LIST.map(s=>STATUS_COLORS[s]), borderWidth:0}]
      },
      options:{
        maintainAspectRatio:false,
        plugins:{
          legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}},
          tooltip:{
            callbacks:{
              label: (ctx) => {
                const pct = Math.round(ctx.parsed/statusTotal*100);
                return `${ctx.label}: ${ctx.parsed} (${pct}%)`;
              }
            }
          },
          datalabels:{
            color:'#fff',
            font:{weight:'bold', size:12},
            formatter:(value) => {
              const pct = Math.round(value/statusTotal*100);
              return pct > 0 ? pct + '%' : '';
            }
          }
        }
      }
    });
  }

  const selectedStatuses = STATUS_LIST.filter(s => chartStatusFilter.has(s));

  // Nhóm chỉ tiêu theo đơn vị -> mỗi đơn vị vẽ 1 biểu đồ riêng (tự thích ứng khi giám đốc thêm/bớt chỉ tiêu)
  const unitGroups = new Map();
  PRODUCTS.forEach(p=>{
    if(!unitGroups.has(p.unit)) unitGroups.set(p.unit, []);
    unitGroups.get(p.unit).push(p);
  });
  [...unitGroups.entries()].forEach(([unit, productsInUnit], idx)=>{
    const el = document.getElementById(`chart-product-unit-${idx}`);
    if(!el) return;
    const datasets = selectedStatuses.map(s => ({
      label: s,
      data: productsInUnit.map(p => (totalPipelineByStatus[s] ? totalPipelineByStatus[s][p.key] : 0)),
      backgroundColor: STATUS_COLORS[s]
    }));
    chartInstances['unit'+idx] = new Chart(el, {
      type:'bar',
      data:{ labels:productsInUnit.map(p=>p.label), datasets },
      options:{
        maintainAspectRatio:false,
        plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}},
        scales:{ x:{stacked:true}, y:{stacked:true, beginAtZero:true, ticks: unit==='Triệu đồng' ? {} : {stepSize:1}} }
      }
    });
  });
  const elEmp = document.getElementById('chart-employee');
  if(elEmp){
    const names = Object.keys(byEmployee);
    chartInstances.employee = new Chart(elEmp, {
      type:'bar',
      data:{
        labels:names,
        datasets:[{data:names.map(n=>byEmployee[n]), backgroundColor:'#10263F', borderRadius:5}]
      },
      options:{
        indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{x:{beginAtZero:true, ticks:{stepSize:1}}}
      }
    });
  }
}

function slugifyKey(label){
  const map = {'à':'a','á':'a','ả':'a','ã':'a','ạ':'a','ă':'a','ằ':'a','ắ':'a','ẳ':'a','ẵ':'a','ặ':'a','â':'a','ầ':'a','ấ':'a','ẩ':'a','ẫ':'a','ậ':'a',
    'đ':'d','è':'e','é':'e','ẻ':'e','ẽ':'e','ẹ':'e','ê':'e','ề':'e','ế':'e','ể':'e','ễ':'e','ệ':'e',
    'ì':'i','í':'i','ỉ':'i','ĩ':'i','ị':'i','ò':'o','ó':'o','ỏ':'o','õ':'o','ọ':'o','ô':'o','ồ':'o','ố':'o','ổ':'o','ỗ':'o','ộ':'o','ơ':'o','ờ':'o','ớ':'o','ở':'o','ỡ':'o','ợ':'o',
    'ù':'u','ú':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ừ':'u','ứ':'u','ử':'u','ữ':'u','ự':'u','ỳ':'y','ý':'y','ỷ':'y','ỹ':'y','ỵ':'y'};
  const lower = label.trim().toLowerCase().split('').map(ch=>map[ch]||ch).join('');
  return lower.replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || ('chi_tieu_'+Date.now());
}

async function moveProduct(key, direction){
  const idx = PRODUCTS.findIndex(p => p.key === key);
  const swapIdx = idx + direction;
  if(idx < 0 || swapIdx < 0 || swapIdx >= PRODUCTS.length) return;
  const keyA = PRODUCTS[idx].key, keyB = PRODUCTS[swapIdx].key;

  const {data:rows, error:fetchErr} = await sb.from('products').select('key,sort_order').in('key', [keyA, keyB]);
  if(fetchErr || !rows || rows.length < 2){ alert('Lỗi khi đọc thứ tự hiện tại: ' + (fetchErr ? fetchErr.message : 'không tìm thấy dữ liệu')); return; }
  const orderA = rows.find(r=>r.key===keyA).sort_order;
  const orderB = rows.find(r=>r.key===keyB).sort_order;

  const {error:err1} = await sb.from('products').update({sort_order:orderB}).eq('key', keyA);
  const {error:err2} = await sb.from('products').update({sort_order:orderA}).eq('key', keyB);
  if(err1 || err2){ alert('Lỗi khi đổi thứ tự: ' + ((err1||err2).message)); return; }

  await loadProducts();
  await loadRecords();
  render();
}

function uniqueVals(field){ return [...new Set(records.map(r=>r[field]).filter(Boolean))].sort(); }

// Trích phần "(từ ... đến ...)" từ chuỗi "Tuần N (từ ... đến ...)" -> dùng để lọc theo tuần lịch
// thật, vì "Tuần N" giờ là số riêng theo từng khách hàng, không so được giữa các khách hàng.
// Chuẩn hóa về "từ ... đến ..." dù dữ liệu cũ đang lưu dạng "Tuần N (từ ... đến ...)"
// hay dữ liệu mới chỉ lưu thẳng "từ ... đến ...".
function extractWeekRangeText(tuanStr){
  if(!tuanStr) return '';
  const m = tuanStr.match(/từ\s*[\d.]+\s*đến\s*[\d.]+/i);
  return m ? m[0].trim() : tuanStr;
}
function uniqueWeekRanges(){
  return [...new Set(records.map(r=>extractWeekRangeText(r.tuan)).filter(Boolean))].sort();
}

function applyFilters(list){

    if(filters.nv && r.tenNhanVien!==filters.nv) return false;
    if(filters.tuan && extractWeekRangeText(r.tuan)!==filters.tuan) return false;
    if(filters.trangThai && r.trangThai!==filters.trangThai) return false;
    if(filters.kw){ const kw=filters.kw.toLowerCase(); if(!`${r.tenKH} ${r.cccd} ${r.sdt}`.toLowerCase().includes(kw)) return false; }
    return true;
  });
}

// Trích số thứ tự tuần từ chuỗi "Tuần 3 (từ ... đến ...)" -> 3. Trả về NaN nếu không có.
function extractWeekNumber(tuanStr){
  if(!tuanStr) return NaN;
  const m = tuanStr.match(/Tu[aầ]n\s*(\d+)/i);
  return m ? parseInt(m[1], 10) : NaN;
}

// So sánh độ "mới" của 2 bản ghi: ưu tiên số Tuần trước (đúng với cách nhập theo tuần),
// sau đó mới đến Ngày update / thời điểm lưu để phân định khi cùng tuần.
function compareRecency(a, b){
  const wkA = extractWeekNumber(a.tuan), wkB = extractWeekNumber(b.tuan);
  if(!isNaN(wkA) && !isNaN(wkB) && wkA !== wkB) return wkA - wkB;
  const dA = a.ngayUpdate || a.updatedAt || '';
  const dB = b.ngayUpdate || b.updatedAt || '';
  return dA.localeCompare(dB);
}

// Dùng khi so sánh giữa CÁC khách hàng khác nhau (số Tuần là riêng theo từng KH nên không so được) -
// luôn so theo ngày thật.
function compareByDate(a, b){
  const dA = a.ngayUpdate || a.updatedAt || '';
  const dB = b.ngayUpdate || b.updatedAt || '';
  return dA.localeCompare(dB);
}

// Xác định trạng thái "hiện tại" của 1 khách hàng: ưu tiên mức tiến triển xa nhất trong phễu
// (Tiềm năng < Liên hệ < Tư vấn < Đàm phán < Thành công/Thất bại); nếu cùng mức thì mới xét đến
// bản ghi gần đây hơn (theo Tuần/ngày) để chọn.
function compareFunnelThenRecency(a, b){
  const rA = STATUS_RANK[a.trangThai] || 0, rB = STATUS_RANK[b.trangThai] || 0;
  if(rA !== rB) return rA - rB;
  return compareRecency(a, b);
}

function latestPerCustomer(list){
  const map = new Map();
  list.forEach(r=>{
    const key = (r.cccd && r.cccd.trim()) ? r.cccd.trim() : (r.tenKH+'|'+r.maAO);
    const cur = map.get(key);
    if(!cur || compareFunnelThenRecency(r, cur) > 0) map.set(key, r);
  });
  return [...map.values()];
}

function renderDirSummary(){
  if(records.length===0) return `<div class="card"><div class="empty">Chưa có dữ liệu nào được nhân viên nhập.</div></div>`;
  const filtered = applyFilters(records);
  const latest = latestPerCustomer(filtered).sort((a,b)=> compareByDate(b,a));
  const byStatus = {}; STATUS_LIST.forEach(s=> byStatus[s] = latest.filter(r=>r.trangThai===s).length);
  const totalPipeline = {}; PRODUCTS.forEach(p => totalPipeline[p.key] = latest.reduce((s,r)=> s + (r[p.key]||0), 0));
  // Tổng pipeline theo sản phẩm, tách riêng theo từng trạng thái (để vẽ cột chồng)
  const totalPipelineByStatus = {};
  STATUS_LIST.forEach(s=>{
    totalPipelineByStatus[s] = {};
    const rowsOfStatus = latest.filter(r=>r.trangThai===s);
    PRODUCTS.forEach(p => totalPipelineByStatus[s][p.key] = rowsOfStatus.reduce((sum,r)=> sum + (r[p.key]||0), 0));
  });
  const byEmployee = {};
  latest.forEach(r=>{ byEmployee[r.tenNhanVien] = (byEmployee[r.tenNhanVien]||0) + 1; });
  dirChartData = {byStatus, totalPipeline, totalPipelineByStatus, byEmployee};

  const statCards = `<div class="stat-cards">
    <div class="stat"><div class="num">${latest.length}</div><div class="lbl">Tổng khách hàng</div></div>
    ${STATUS_LIST.map(s=>`<div class="stat"><div class="num">${byStatus[s]}</div><div class="lbl">${s}</div></div>`).join('')}
  </div>`;

  const unitGroupsForRender = new Map();
  PRODUCTS.forEach(p=>{
    if(!unitGroupsForRender.has(p.unit)) unitGroupsForRender.set(p.unit, []);
    unitGroupsForRender.get(p.unit).push(p);
  });
  const unitChartBoxes = [...unitGroupsForRender.keys()].map((unit, idx) => `
    <div class="chart-box"><h4>Pipeline theo sản phẩm, theo trạng thái (${unit})</h4><div class="chart-canvas-wrap wide"><canvas id="chart-product-unit-${idx}"></canvas></div></div>
  `).join('');

  const chartsSection = `
    <div class="card">
      <h3>📊 Biểu đồ tổng quan</h3>
      <div class="charts-grid">
        <div class="chart-box"><h4>Phân bổ khách hàng theo trạng thái</h4><div class="chart-canvas-wrap"><canvas id="chart-status"></canvas></div></div>
        <div class="chart-box"><h4>Số lượng khách hàng theo nhân viên</h4><div class="chart-canvas-wrap"><canvas id="chart-employee"></canvas></div></div>
      </div>
      <div class="chart-status-filter">
        <span class="filter-title">Hiện trạng thái trong biểu đồ pipeline:</span>
        ${STATUS_LIST.map(s=>`
          <label>
            <input type="checkbox" ${chartStatusFilter.has(s)?'checked':''} onchange="toggleChartStatus('${s}', this.checked)">
            <span class="dot" style="background:${STATUS_COLORS[s]};"></span>${s}
          </label>`).join('')}
      </div>
      <div class="charts-grid" style="margin-top:12px;">
        ${unitChartBoxes}
      </div>
    </div>`;

  const productTotals = `<div class="card"><h3>💰 Tổng Pipeline theo sản phẩm (theo trạng thái đang chọn ở trên)</h3>
    <div class="grid4">${PRODUCTS.map(p=>{
      const sum = [...chartStatusFilter].reduce((acc,s)=> acc + (totalPipelineByStatus[s] ? totalPipelineByStatus[s][p.key] : 0), 0);
      return `<div class="stat"><div class="num">${sum.toLocaleString('vi-VN')}</div><div class="lbl">${p.label}</div></div>`;
    }).join('')}</div></div>`;

  const rows = latest.map(r => `<tr>
    <td><b class="clickable-name" style="cursor:pointer; text-decoration:underline dotted; color:var(--navy);" onclick="showCustomerNote(&#39;${r.id}&#39;)" title="Bấm để xem ghi chú">${r.tenKH}</b></td><td>${r.tenNhanVien}</td><td>${r.maAO||'-'}</td><td>${r.sdt||'-'}</td><td>${r.tuan||'-'}</td><td>${r.ngayUpdate||'-'}</td>
    <td><span class="badge" style="background:${STATUS_COLORS[r.trangThai]||'#888'}">${r.trangThai||'-'}</span></td>
    ${PRODUCTS.map(p=>`<td>${r[p.key]||0}</td>`).join('')}
  </tr>`).join('');

  return `${statCards}${chartsSection}${productTotals}<div class="card"><h3>📌 Tóm tắt tình hình hiện tại theo từng khách hàng (${latest.length})</h3>${renderFilterBar()}
    <div class="table-scroll"><table><thead><tr>
      <th>Tên KH</th><th>Nhân viên</th><th>Mã AO</th><th>SĐT</th><th>Tuần</th><th>Ngày update</th><th>Trạng thái</th>
      ${PRODUCTS.map(p=>`<th>${p.label}</th>`).join('')}
    </tr></thead><tbody>${rows || `<tr><td colspan="${7+PRODUCTS.length}" class="empty">Không có bản ghi phù hợp bộ lọc.</td></tr>`}</tbody></table></div></div>`;
}

function renderDirHistory(){
  if(records.length===0) return `<div class="card"><div class="empty">Chưa có dữ liệu nào được nhân viên nhập.</div></div>`;
  const filtered = applyFilters(records).sort((a,b)=> compareByDate(b,a));
  const rows = filtered.map(r => `<tr>
    <td>${r.tuan||'-'}</td><td>${r.ngayUpdate||'-'}</td><td>${r.tenNhanVien}</td><td><b class="clickable-name" style="cursor:pointer; text-decoration:underline dotted; color:var(--navy);" onclick="showCustomerNote(&#39;${r.id}&#39;)" title="Bấm để xem ghi chú">${r.tenKH}</b></td><td>${r.cccd||'-'}</td><td>${r.sdt||'-'}</td>
    <td>${r.ngheNghiep||'-'}</td><td>${r.donVi||'-'}</td><td><span class="badge" style="background:${STATUS_COLORS[r.trangThai]||'#888'}">${r.trangThai||'-'}</span></td>
    ${PRODUCTS.map(p=>`<td>${r[p.key]||0}</td>`).join('')}
  </tr>`).join('');
  return `<div class="card"><h3>🗂️ Toàn bộ lịch sử cập nhật (${filtered.length} / ${records.length})</h3>${renderFilterBar()}
    <div class="table-scroll"><table><thead><tr>
      <th>Tuần</th><th>Ngày update</th><th>Nhân viên</th><th>Tên KH</th><th>CCCD</th><th>SĐT</th><th>Nghề nghiệp</th><th>ĐV công tác</th><th>Trạng thái</th>
      ${PRODUCTS.map(p=>`<th>${p.label}</th>`).join('')}
    </tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

checkExistingSession();
</script>
